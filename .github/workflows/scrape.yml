name: Newsstand Scraper (backup)

# Backup scraper only. The bot scrapes in-process every ~15 min as the primary
# path; this hourly run just covers the case where the bot host is down. Running
# it sparsely (vs every 15 min) avoids racing the in-process cycle and
# double-delivering — by the time this runs, the bot has usually delivered
# already, so dedup makes it a no-op.
on:
  schedule:
    - cron: '0 * * * *'   # hourly
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  scrape-and-deliver:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper and Delivery Engine
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python run_scrapers.py

name: Deploy Newsstand Bot

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            set -e
            
            # Navigate to project
            cd ~/newsstand-bot
            
            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git pull origin main
            
            # Activate venv and install deps
            echo "📦 Installing dependencies..."
            source venv/bin/activate
            pip install -r requirements.txt --quiet --upgrade
            
            # Restart the bot service
            echo "🔄 Restarting bot..."
            sudo systemctl restart newsstand-bot
            
            # Wait a moment and check status
            sleep 3
            if sudo systemctl is-active --quiet newsstand-bot; then
              echo "✅ Bot deployed successfully: $(git log -1 --format='%h %s')"
            else
              echo "❌ Bot failed to start!"
              sudo journalctl -u newsstand-bot --no-pager -n 20
              exit 1
            fi
